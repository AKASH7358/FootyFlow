version: '3.8'

networks:
  footyflow-net:
    driver: bridge

volumes:
  postgres-data:

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks:
      - footyflow-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks:
      - footyflow-net
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"      # your Python scripts connect on this port
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - footyflow-net
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: footyflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092


  postgres:
    image: postgres:15
    container_name: postgres
    networks:
      - footyflow-net
    ports:
      - "5433:5432"      # your Python scripts and dbt connect here
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}


  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow
    networks:
      - footyflow-net
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'footyflow-secret'
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
      # --- ops agent ---
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_DB_HOST: postgres
      AGENT_DB_PORT: "5432"
      AGENT_DB_NAME: ${POSTGRES_DB}
      AGENT_DB_USER: footyflow_agent
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
      AIRFLOW_URL: http://localhost:8080
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./producer:/opt/airflow/producer
      - ./consumer:/opt/airflow/consumer
      - ./transform:/opt/airflow/transform
      - ./agent:/opt/airflow/agent
    
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Akash --lastname Dev --role Admin --email admin@footyflow.com || true; airflow scheduler & exec airflow webserver"

  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - footyflow-net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: footyflow123